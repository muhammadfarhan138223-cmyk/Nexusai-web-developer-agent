    links it back to farhanbalouch.com, so search engines connect the
    two as the same person/owner.
  -->

    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Buildora",
    "url": "https://buildora.vercel.app/",
    "description": "Buildora is a free AI website builder — describe your idea in plain words and get a live, working website instantly.",

    "operatingSystem": "Any (Web-based)",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "author": {
      "@type": "Person",
      "name": "Farhan Balouch",
      "url": "https://farhanbalouch.com"
    },
    "creator": {
      "@type": "Person",
      "name": "Farhan Balouch",
      "url": "https://farhanbalouch.com"
    }
  }
  </script>
</head>
